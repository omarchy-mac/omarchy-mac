name: Install VM

# Isolated install.sh on a self-hosted Apple Silicon runner (systemd-nspawn).
#
# Triggers are workflow_dispatch and a nightly schedule only — never
# pull_request. This repo is public; a self-hosted runner on a desktop must
# not execute untrusted fork code. The job-level `if` is a second fence so a
# fork that copies this file still no-ops unless it also has our runner.
#
# Required runner labels (GitHub matching is case-insensitive):
#   self-hosted, linux (shown as Linux), ARM64
# Extra label we set at registration: kvm
# Capabilities: systemd-nspawn, passwordless sudo, network, several GB free.
# See docs/runner-requirements.md.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Same-repository PR number, branch, tag, or full heads/tags ref (blank uses the default branch)"
        required: false
        type: string
      idempotency:
        description: "Run install.sh a second time against the installed machine"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 5 * * *"

concurrency:
  group: install-vm
  # A new dispatch or nightly should not stack two full installs on a 34G disk.
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  install:
    name: install.sh on Arch Linux ARM
    # Skip on forks even if someone re-adds pull_request. This is not redundant
    # with the trigger list: it is the fork fence.
    if: >-
      github.repository == 'omarchy-mac/omarchy-mac' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.actor == 'malik-na'))
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 120
    env:
      INSTALL_VM_ROOT: /var/tmp/omarchy-install-vm
    steps:
      # Resolve user input using the API before any selected repository code is
      # checked out. Pull requests from forks are deliberately rejected.
      - name: Resolve trusted target
        id: target
        uses: actions/github-script@v7
        env:
          TARGET: ${{ inputs.target || '' }}
        with:
          script: |
            const target = process.env.TARGET.trim()
            let sha
            let display

            if (!target) {
              const repository = await github.rest.repos.get(context.repo)
              const branch = repository.data.default_branch
              const result = await github.rest.repos.getCommit({ ...context.repo, ref: branch })
              sha = result.data.sha
              display = branch
            } else if (/^[1-9][0-9]*$/.test(target)) {
              const pull = await github.rest.pulls.get({ ...context.repo, pull_number: Number(target) })
              if (pull.data.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                core.setFailed(`PR #${target} comes from ${pull.data.head.repo?.full_name || 'a fork'}; self-hosted runs only accept same-repository PRs`)
                return
              }
              sha = pull.data.head.sha
              display = `PR #${target} (${pull.data.head.ref})`
            } else {
              if (!/^[0-9A-Za-z._/-]+$/.test(target) || target.includes('..') || target.startsWith('/') || target.endsWith('/')) {
                core.setFailed('target is not a valid branch, tag, or full heads/tags ref')
                return
              }

              const branch = target.startsWith('refs/heads/') ? target.slice(11) : target
              const tag = target.startsWith('refs/tags/') ? target.slice(10) : target
              if (target.startsWith('refs/') && !target.startsWith('refs/heads/') && !target.startsWith('refs/tags/')) {
                core.setFailed('only refs/heads/* and refs/tags/* are accepted')
                return
              }

              if (!target.startsWith('refs/tags/')) {
                try {
                  const result = await github.rest.repos.getBranch({ ...context.repo, branch })
                  sha = result.data.commit.sha
                  display = `branch ${branch}`
                } catch (error) {
                  if (error.status !== 404 || target.startsWith('refs/heads/')) throw error
                }
              }
              if (!sha) {
                const result = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` })
                let object = result.data.object
                const seen = new Set()
                for (let depth = 0; object.type === 'tag'; depth++) {
                  if (depth >= 10 || seen.has(object.sha)) {
                    core.setFailed(`tag ${tag} has an invalid or excessively deep annotation chain`)
                    return
                  }
                  seen.add(object.sha)
                  const annotation = await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha })
                  object = annotation.data.object
                }
                if (object.type !== 'commit') {
                  core.setFailed(`tag ${tag} resolves to ${object.type}, not a commit`)
                  return
                }
                sha = object.sha
                display = `tag ${tag}`
              }
            }

            core.setOutput('sha', sha)
            core.setOutput('display', display)
            await core.summary.addHeading('Install VM target').addTable([
              [{ data: 'Requested', header: true }, target || '(default branch)'],
              [{ data: 'Resolved', header: true }, display],
              [{ data: 'Commit', header: true }, sha],
            ]).write()

      - name: Checkout resolved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Diagnostics
        run: |
          uname -a
          id
          getconf PAGESIZE
          df -h
          free -m
          command -v systemd-nspawn
          command -v sudo

      - name: Pre-check run-install
        run: |
          if [[ ! -f ./test/vm/run-install ]]; then
            echo "run-install not found at ./test/vm/run-install" >&2
            exit 1
          fi
          if [[ ! -x ./test/vm/run-install ]]; then
            echo "run-install exists but is not executable" >&2
            exit 1
          fi
          echo "pre-check: ./test/vm/run-install is executable"

      - name: Prepare log directory
        run: |
          sudo mkdir -p "$INSTALL_VM_ROOT/logs"
          sudo chown "$(id -u):$(id -g)" "$INSTALL_VM_ROOT" "$INSTALL_VM_ROOT/logs"

      - name: Run isolated install
        env:
          OMARCHY_INSTALL_VM_IDEMPOTENCY: ${{ github.event_name == 'workflow_dispatch' && inputs.idempotency && '1' || '0' }}
        run: |
          set +e
          sudo --preserve-env=HOME,OMARCHY_INSTALL_VM_IDEMPOTENCY ./test/vm/run-install
          status=$?
          set -e
          printf '%s\n' "$status" >"$INSTALL_VM_ROOT/logs/exit_code"
          if [[ -n ${GITHUB_STEP_SUMMARY:-} ]]; then
            if (( status == 0 )); then
              printf 'install harness exited 0\n' >>"$GITHUB_STEP_SUMMARY"
            else
              printf 'install harness failed with exit %s. See the install-vm-logs artifact.\n' "$status" >>"$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit "$status"

      - name: Compress logs
        if: always()
        run: |
          mkdir -p "$INSTALL_VM_ROOT/logs"
          tar -czf "$INSTALL_VM_ROOT/logs.tar.gz" -C "$INSTALL_VM_ROOT" logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-vm-logs
          path: /var/tmp/omarchy-install-vm/logs.tar.gz
          retention-days: 7
          if-no-files-found: ignore
